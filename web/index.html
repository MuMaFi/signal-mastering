<!DOCTYPE html>

<head>

<!-- The bar stays pinned; the large title scrolls away beneath it, as on iOS. -->
<header class="nav" id="nav">

    <span class="nav-compact-title">Isolate</span>
    <button class="nav-action" id="theme-toggle" aria-label="Switch appearance">Aa</button>
  </div>
</header>

<div class="large-title" id="large-title">
  <h1>Isolate</h1>
  <p>Separate vocals from the backing track, on your own device.</p>
</div>

<main id="main"></main>

<input type="file" id="file-input" accept="audio/*" hidden>

<script type="module" src="app.js"></script>
