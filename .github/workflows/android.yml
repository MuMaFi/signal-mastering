name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "web/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "web/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest already ships the Android SDK; android-actions/setup-android@v3
      # still asks for the long-removed "tools" package and fails the job, so the
      # needed packages are installed straight from the runner's own sdkmanager.
      - name: Install Android SDK packages
        run: |
          set -eu
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon
        continue-on-error: true

      # Model weights are ~900 MB, so CI runs only the checks that need no download.
      # The full comparison against the NumPy reference is documented in
      # android/tools/verify/README.md and is run locally before release.
      - name: DSP self-checks
        working-directory: android
        run: ./gradlew :tools:verify:run --no-daemon --args="no-fixtures no-models"

      # Renders every screen with layoutlib and compares it to the recorded PNGs in
      # app/src/test/snapshots, so a visual regression fails the build.
      - name: Screenshot tests
        working-directory: android
        run: ./gradlew :app:verifyPaparazziDebug --no-daemon

      - name: Colour contrast (WCAG AA)
        run: node web/contrast.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: paparazzi-failures
          path: android/app/build/paparazzi/failures
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
