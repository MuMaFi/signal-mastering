name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon
        continue-on-error: true

      # Model weights are ~900 MB, so CI runs only the checks that need no download.
      # The full comparison against the NumPy reference is documented in
      # android/tools/verify/README.md and is run locally before release.
      - name: DSP self-checks
        working-directory: android
        run: ./gradlew :tools:verify:run --no-daemon --args="no-fixtures no-models"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
