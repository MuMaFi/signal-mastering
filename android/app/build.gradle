plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mumafi.signal'
    compileSdk 34

    defaultConfig {
        applicationId "com.mumafi.signal"
        // API 29 is where MediaStore.Downloads arrives, which is what lets the app
        // write an exported master into the user's Downloads folder without asking
        // for any storage permission at all.
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // AndroidX pulls in several Kotlin stdlib versions transitively. Since 1.8 the
    // jdk7/jdk8 artifacts were folded into the main one, so leaving the old ones on
    // the classpath duplicates every class they hold and dexing refuses to run.
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // WebViewAssetLoader: serves the bundled page from an https:// origin instead
    // of file://, which is what makes Blob-backed Web Workers load at all.
    implementation 'androidx.webkit:webkit:1.11.0'
}
